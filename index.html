  el.classList.add('answered');
  $$('.opt',el).forEach(function(b){var v=+b.dataset.k;b.disabled=true;b.classList.toggle('correct',v===q.answer);b.classList.toggle('wrong',v===k&&!ok);});
  var ex=$('.expl',el);ex.hidden=false;ex.className='expl '+(ok?'ok':'no');$('.verdict',ex).textContent=ok?'Верно':'Неверно';
}
function resetQuiz(el){
  el.classList.remove('answered');
  $$('.opt',el).forEach(function(b){b.disabled=false;b.classList.remove('correct','wrong');});
  $('.expl',el).hidden=true;
}
function restoreQuizzes(root){$$('.quiz',root).forEach(function(el){var v=state.quiz[el.dataset.q];if(v!=null)markQuiz(el,v);});}

/* ---------- router ---------- */
var currentQuizFilter='all',currentRoute='';
function route(){
  var parts=location.hash.replace(/^#\/?/,'').split('/'),p0=parts[0]||'',html,key=p0||'home',anchor=null;
  if(p0==='s'){
    var sec=secByNum(parts[1]);
    if(!sec){location.hash='#/';return;}
    html=sectionView(sec);key='s/'+sec.num;anchor=parts[2]||null;
  }else if(p0==='quiz'){currentQuizFilter=parts[1]||'all';html=quizView(currentQuizFilter);}
  else if(p0==='cards')html=cardsView();
  else if(p0==='tools')html=toolsView();
  else if(p0==='plan')html=planView();
  else if(p0==='search'){var q=decodeURIComponent(parts.slice(1).join('/'));html=searchView(q);if($('#q').value!==q&&document.activeElement!==$('#q'))$('#q').value=q;}
  else {html=homeView();key='home';}
  var main=$('#main'),samePage=(key===currentRoute&&p0==='s');
  if(!samePage){main.innerHTML='<div class="wrap">'+html+'</div>';restoreQuizzes(main);}
  currentRoute=key;
  renderNav(key);
  document.body.classList.remove('nav-open');
  updateScore();drawCard();calcTools();drawTimer();
  var tSec=p0==='s'?secByNum(parts[1]):null;
  document.title=(tSec?tSec.title+' — ':'')+'ACCA AA (F8)';
  if(anchor){
    var t=document.getElementById(anchor);
    if(t){setTimeout(function(){t.scrollIntoView({behavior:samePage?'smooth':'auto',block:'start'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');},samePage?0:30);}
  }else if(!samePage){window.scrollTo(0,0);}
}
window.addEventListener('hashchange',route);

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var opt=t.closest('.opt');
  if(opt&&!opt.disabled){var el=opt.closest('.quiz'),k=+opt.dataset.k;state.quiz[el.dataset.q]=k;save('quiz');markQuiz(el,k);updateScore();renderNav(currentRoute);return;}
  if(t.closest('[data-retry]')){var qe=t.closest('.quiz');delete state.quiz[qe.dataset.q];save('quiz');resetQuiz(qe);updateScore();renderNav(currentRoute);return;}
  var rq=t.closest('[data-reset-quiz]');
  if(rq){var f=rq.dataset.resetQuiz;quizzes.forEach(function(q){if(f==='all'||q.mod===f)delete state.quiz[q.id];});save('quiz');$$('.quiz').forEach(resetQuiz);updateScore();renderNav(currentRoute);return;}
  var rd=t.closest('[data-read]');
  if(rd){var id=rd.dataset.read;if(state.read[id])delete state.read[id];else state.read[id]=true;save('read');
    var on=!!state.read[id];rd.className='btn '+(on?'btn-ok':'primary');rd.textContent=on?'✓ Раздел изучен':'Отметить раздел как изученный';renderNav(currentRoute);return;}
  var lb=t.closest('[data-letter]');
  if(lb){var tg=document.getElementById('tg-'+lb.dataset.letter);if(tg)tg.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(t.closest('#fc')){cards.flip=!cards.flip;drawCard();return;}
  var fb=t.closest('[data-fc]');
  if(fb){var a=fb.dataset.fc;
    if(a==='next')fcMove(1);else if(a==='prev')fcMove(-1);
    else if(a==='shuffle'){for(var i=cards.order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),tmp=cards.order[i];cards.order[i]=cards.order[j];cards.order[j]=tmp;}cards.i=0;cards.flip=false;drawCard();}
    else if(a==='known'){var g=glossary[cards.order[cards.i]];if(state.known[g.en])delete state.known[g.en];else state.known[g.en]=true;save('known');drawCard();}
    return;}
  var dd=t.closest('[data-dir]');
  if(dd){cards.dir=dd.dataset.dir;cards.flip=false;$$('[data-dir]').forEach(function(b){b.classList.toggle('on',b===dd);});drawCard();return;}
  var gb=t.closest('[data-group] button');
  if(gb){$$('button',gb.parentNode).forEach(function(b){b.classList.toggle('on',b===gb);});calc705();return;}
  var tb=t.closest('[data-timer]');
  if(tb){
    if(tb.dataset.timer==='reset'){clearInterval(timer.h);timer.run=false;timer.left=3*3600;}
    else if(timer.run){clearInterval(timer.h);timer.run=false;}
    else if(timer.left>0){timer.run=true;timer.h=setInterval(function(){timer.left=Math.max(0,timer.left-1);if(!timer.left){clearInterval(timer.h);timer.run=false;}drawTimer();},1000);}
    drawTimer();return;}
});
document.addEventListener('change',function(e){
  var w=e.target.closest('[data-week]');
  if(w){var k=w.dataset.week;if(w.checked)state.plan[k]=true;else delete state.plan[k];save('plan');
    var html=planView(),m=$('#main');var y=window.scrollY;m.innerHTML='<div class="wrap">'+html+'</div>';window.scrollTo(0,y);renderNav(currentRoute);}
});
document.addEventListener('input',function(e){
  if(e.target.closest('.tool'))calcTools();
  if(e.target.id==='gFilter'){var v=e.target.value.toLowerCase();$$('#gBody .term').forEach(function(r){r.hidden=v&&r.textContent.toLowerCase().indexOf(v)<0;});
    var any=false;$$('#gBody .tgroup').forEach(function(g){var vis=$$('.term',g).some(function(t){return !t.hidden;});g.hidden=!vis;any=any||vis;});
    $('#gEmpty').hidden=any;}
});
document.addEventListener('keydown',function(e){
  if(!$('#fc')||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowRight'){fcMove(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){fcMove(-1);e.preventDefault();}
  else if(e.key===' '&&document.activeElement.id!=='fc'){cards.flip=!cards.flip;drawCard();e.preventDefault();}
});

var qTimer;
$('#q').addEventListener('input',function(){
  var v=this.value.trim();clearTimeout(qTimer);
  qTimer=setTimeout(function(){
    if(v.length>=2){var h='#/search/'+encodeURIComponent(v);if(/^#\/search\//.test(location.hash))history.replaceState(null,'',h),route();else location.hash=h;}
    else if(!v&&/^#\/search\//.test(location.hash))location.hash='#/';
  },220);
});
$('#q').addEventListener('keydown',function(e){if(e.key==='Escape'){this.value='';this.blur();}});
$('#menuBtn').addEventListener('click',function(){document.body.classList.toggle('nav-open');});
$('#scrim').addEventListener('click',function(){document.body.classList.remove('nav-open');});

var theme=LS.get('theme',null);
if(theme)document.documentElement.dataset.theme=theme;
$('#themeBtn').addEventListener('click',function(){
  var curT=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  var nx=curT==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;LS.set('theme',nx);
});

route();
})();
</script>
</body>
</html>
